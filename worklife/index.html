<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作生活</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-head">
      <div class="side-brand">工作生活</div>
      <div id="side-date" class="side-date"></div>
    </div>
    <nav id="nav" class="nav" aria-label="主导航"></nav>
    <div class="side-foot">
      <div id="storage-status" class="storage-status">数据已保存在本机</div>
      <div class="side-foot-row">
        <button id="quick-backup" type="button" class="link-btn" data-testid="quick-backup">立即备份</button>
        <button id="theme-toggle" type="button" class="link-btn" data-testid="theme-toggle">切换主题</button>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="page-title" class="page-title"></h1>
        <p id="page-desc" class="page-desc"></p>
        <div id="save-indicator" class="save-indicator" data-testid="save-indicator"></div>
      </div>
      <div id="page-actions" class="page-actions"></div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>
<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/shell.js"></script>
<script src="js/page-home.js"></script>
<script src="js/page-today.js"></script>
<script src="js/page-media.js"></script>
<script src="js/page-dev.js"></script>
<script src="js/page-consult.js"></script>
<script src="js/page-fitness.js"></script>
<script src="js/page-diet.js"></script>
<script src="js/page-games.js"></script>
<script src="js/page-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
